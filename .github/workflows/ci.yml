name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: /tmp/npm-cache
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: DT_DataCenter
      PGUSER: bagus
      PGPASSWORD: dt-ci-${{ github.run_id }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: DT_DataCenter
          POSTGRES_USER: bagus
          POSTGRES_PASSWORD: dt-ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bagus -d DT_DataCenter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:database
