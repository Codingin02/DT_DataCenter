<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <rect width="1200" height="700" fill="#0d1117"/>
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#161b22" stroke="#30363d"/>
  <text x="30" y="38" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="bold">Digital Twin Data Center — Real-Time Operations</text>
  <rect x="1000" y="16" width="170" height="28" rx="14" fill="#238636"/>
  <text x="1030" y="35" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600">● LIVE SSE STREAM</text>

  <!-- Left Sidebar (Rack Inventory & Streams) -->
  <rect x="20" y="80" width="280" height="590" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="115" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="bold">Cabinet Assets (42U)</text>
  
  <rect x="35" y="135" width="250" height="48" rx="6" fill="#21262d" stroke="#388bfd"/>
  <text x="50" y="158" fill="#58a6ff" font-family="sans-serif" font-size="13" font-weight="600">Rack Unit 1: Top Server</text>
  <text x="50" y="174" fill="#8b949e" font-family="sans-serif" font-size="11">SHT31 Sensor A • INMP441 Mic</text>

  <rect x="35" y="195" width="250" height="48" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="50" y="218" fill="#c9d1d9" font-family="sans-serif" font-size="13" font-weight="600">Rack Unit 2: Lower Server</text>
  <text x="50" y="234" fill="#8b949e" font-family="sans-serif" font-size="11">SHT31 Sensor B • Active Scope</text>

  <rect x="35" y="255" width="250" height="48" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="50" y="278" fill="#c9d1d9" font-family="sans-serif" font-size="13" font-weight="600">PDU: Shelly Plug PM Gen3</text>
  <text x="50" y="294" fill="#8b949e" font-family="sans-serif" font-size="11">Active Power, Energy, Voltage</text>

  <text x="40" y="340" fill="#c9d1d9" font-family="sans-serif" font-size="14" font-weight="bold">Stream Telemetry Rates</text>
  <rect x="35" y="355" width="250" height="70" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="50" y="380" fill="#8b949e" font-family="sans-serif" font-size="12">Sensor Polling: <tspan fill="#7ee787">1.0 Hz (authoritative)</tspan></text>
  <text x="50" y="405" fill="#8b949e" font-family="sans-serif" font-size="12">Acoustic Sampling: <tspan fill="#7ee787">48 kHz I2S 24-bit</tspan></text>

  <!-- Middle 3D Nirax Rack Viewport -->
  <rect x="320" y="80" width="560" height="590" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="340" y="115" fill="#c9d1d9" font-family="sans-serif" font-size="16" font-weight="bold">3D WebGL / Three.js Twin Canvas</text>
  
  <!-- Canvas representation -->
  <rect x="335" y="135" width="530" height="515" rx="6" fill="#090d13" stroke="#21262d"/>
  <!-- 3D Rack Wireframe -->
  <rect x="480" y="180" width="240" height="420" rx="4" fill="#131922" stroke="#58a6ff" stroke-dasharray="2,2"/>
  <rect x="500" y="220" width="200" height="28" rx="2" fill="#21262d" stroke="#8b949e"/>
  <rect x="500" y="260" width="200" height="28" rx="2" fill="#21262d" stroke="#8b949e"/>
  <rect x="500" y="300" width="200" height="28" rx="2" fill="#21262d" stroke="#8b949e"/>
  <rect x="500" y="420" width="200" height="60" rx="2" fill="#1c2128" stroke="#388bfd"/>
  <text x="530" y="455" fill="#79c0ff" font-family="sans-serif" font-size="13" font-weight="bold">Active Target Server</text>

  <!-- Heatmap Effect Overlay -->
  <circle cx="560" cy="450" r="30" fill="#f85149" fill-opacity="0.3"/>
  <circle cx="560" cy="450" r="8" fill="#f85149"/>
  <text x="600" y="445" fill="#ff7b72" font-family="sans-serif" font-size="11">Sensor A: 27.4°C</text>
  <text x="600" y="462" fill="#79c0ff" font-family="sans-serif" font-size="11">Humidity: 58.2%</text>

  <!-- Right Sidebar (Telemetry Charts & Gauges) -->
  <rect x="900" y="80" width="280" height="590" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="920" y="115" fill="#c9d1d9" font-family="sans-serif" font-size="16" font-weight="bold">Telemetry Analytics</text>

  <rect x="915" y="135" width="250" height="150" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="930" y="160" fill="#c9d1d9" font-family="sans-serif" font-size="13" font-weight="600">Temperature & Humidity (5-day)</text>
  <polyline points="930,240 960,230 990,225 1020,235 1050,220 1080,215 1110,210 1145,215" fill="none" stroke="#f0883e" stroke-width="2"/>
  <polyline points="930,265 960,260 990,255 1020,262 1050,258 1080,250 1110,245 1145,248" fill="none" stroke="#58a6ff" stroke-width="2"/>

  <rect x="915" y="305" width="250" height="150" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="930" y="330" fill="#c9d1d9" font-family="sans-serif" font-size="13" font-weight="600">Acoustic Sound Pressure</text>
  <polyline points="930,410 950,430 970,370 990,420 1010,390 1030,425 1050,380 1070,415 1090,395 1110,430 1145,400" fill="none" stroke="#a371f7" stroke-width="1.5"/>
  <text x="930" y="445" fill="#8b949e" font-family="sans-serif" font-size="11">RMS: -42.8 dBFS • Peak: -28.1 dBFS</text>

  <rect x="915" y="475" width="250" height="175" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="930" y="500" fill="#c9d1d9" font-family="sans-serif" font-size="13" font-weight="600">Electrical & Power (Shelly PM)</text>
  <text x="930" y="530" fill="#7ee787" font-family="sans-serif" font-size="22" font-weight="bold">142.6 W</text>
  <text x="930" y="555" fill="#8b949e" font-family="sans-serif" font-size="12">Voltage: 228.4 V • Current: 0.64 A</text>
  <text x="930" y="575" fill="#8b949e" font-family="sans-serif" font-size="12">Accumulated Energy: 18.42 kWh</text>
  <text x="930" y="625" fill="#58a6ff" font-family="sans-serif" font-size="11">QoS 1 Ingestion • Synced to PostgreSQL</text>
</svg>
