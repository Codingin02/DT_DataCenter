<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%">
  <rect width="1100" height="500" fill="#0d1117"/>
  <text x="30" y="38" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="bold">Digital Twin Data Center — End-to-End System Architecture</text>
  <text x="30" y="60" fill="#8b949e" font-family="sans-serif" font-size="12">Physical Sensor Acquisition • Authoritative Ingestion • PostgreSQL Database • 3D Frontend &amp; Tailscale Ingress</text>

  <!-- Physical Layer -->
  <rect x="30" y="90" width="220" height="370" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="120" fill="#58a6ff" font-family="sans-serif" font-size="14" font-weight="bold">1. Physical Acquisition</text>
  
  <rect x="45" y="140" width="190" height="70" rx="6" fill="#21262d" stroke="#388bfd"/>
  <text x="55" y="165" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold">ESP32-S3 Board</text>
  <text x="55" y="185" fill="#8b949e" font-family="sans-serif" font-size="11">ESP32-S3-WROOM-1-N16R8</text>
  <text x="55" y="200" fill="#7ee787" font-family="sans-serif" font-size="10">Authoritative Clock &amp; Ingestion</text>

  <rect x="45" y="225" width="190" height="60" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="55" y="245" fill="#c9d1d9" font-family="sans-serif" font-size="11" font-weight="bold">2x DFRobot SHT31</text>
  <text x="55" y="260" fill="#8b949e" font-family="sans-serif" font-size="10">I2C0 (GPIO 8/9) &amp; I2C1 (10/11)</text>
  <text x="55" y="275" fill="#8b949e" font-family="sans-serif" font-size="10">50 kHz Clock • CRC Verified</text>

  <rect x="45" y="300" width="190" height="55" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="55" y="320" fill="#c9d1d9" font-family="sans-serif" font-size="11" font-weight="bold">INMP441 Microphone</text>
  <text x="55" y="335" fill="#8b949e" font-family="sans-serif" font-size="10">I2S Digital MEMS 24-bit 48kHz</text>
  <text x="55" y="348" fill="#8b949e" font-family="sans-serif" font-size="10">WS(4) BCLK(5) DIN(6)</text>

  <rect x="45" y="370" width="190" height="65" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="55" y="390" fill="#c9d1d9" font-family="sans-serif" font-size="11" font-weight="bold">Shelly Plug PM Gen3</text>
  <text x="55" y="405" fill="#8b949e" font-family="sans-serif" font-size="10">PDU Voltage, Current, Power</text>
  <text x="55" y="420" fill="#8b949e" font-family="sans-serif" font-size="10">Energy Counters via Wi-Fi</text>

  <!-- Network Transport Layer -->
  <line x1="250" y1="275" x2="330" y2="275" stroke="#388bfd" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="265" fill="#79c0ff" font-family="sans-serif" font-size="11">MQTT QoS 1</text>

  <!-- Host Server Container Stack -->
  <rect x="330" y="90" width="460" height="370" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="350" y="120" fill="#58a6ff" font-family="sans-serif" font-size="14" font-weight="bold">2. Server Docker Stack (192.168.1.167)</text>

  <rect x="350" y="140" width="190" height="70" rx="6" fill="#21262d" stroke="#388bfd"/>
  <text x="360" y="165" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold">Mosquitto 2.1 MQTT</text>
  <text x="360" y="180" fill="#8b949e" font-family="sans-serif" font-size="10">Port 1883 • Auth Passwd</text>
  <text x="360" y="195" fill="#7ee787" font-family="sans-serif" font-size="10">dt/telemetry, dt/shelly</text>

  <rect x="350" y="230" width="190" height="90" rx="6" fill="#21262d" stroke="#388bfd"/>
  <text x="360" y="255" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold">Backend Node.js Service</text>
  <text x="360" y="270" fill="#8b949e" font-family="sans-serif" font-size="10">Strict AJV Schema Ingestion</text>
  <text x="360" y="285" fill="#8b949e" font-family="sans-serif" font-size="10">Current-State Cache &amp; SSE</text>
  <text x="360" y="300" fill="#8b949e" font-family="sans-serif" font-size="10">Port 3000 (Internal Only)</text>

  <rect x="350" y="340" width="190" height="95" rx="6" fill="#21262d" stroke="#388bfd"/>
  <text x="360" y="365" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold">PostgreSQL 17.11</text>
  <text x="360" y="380" fill="#8b949e" font-family="sans-serif" font-size="10">Database: DT_DataCenter</text>
  <text x="360" y="395" fill="#8b949e" font-family="sans-serif" font-size="10">5-Day Bucketed Raw History</text>
  <text x="360" y="410" fill="#8b949e" font-family="sans-serif" font-size="10">Named Volume: postgres-data</text>

  <rect x="580" y="140" width="190" height="180" rx="6" fill="#21262d" stroke="#388bfd"/>
  <text x="590" y="165" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold">Nginx 1.28 Web Proxy</text>
  <text x="590" y="185" fill="#7ee787" font-family="sans-serif" font-size="11">Port 80 (0.0.0.0 LAN)</text>
  <text x="590" y="205" fill="#8b949e" font-family="sans-serif" font-size="10">• Serves Frontend Dist</text>
  <text x="590" y="220" fill="#8b949e" font-family="sans-serif" font-size="10">• Full LAN Capabilities</text>
  <line x1="590" y1="230" x2="760" y2="230" stroke="#30363d"/>
  <text x="590" y="250" fill="#f0883e" font-family="sans-serif" font-size="11">Port 8080 (127.0.0.1)</text>
  <text x="590" y="270" fill="#8b949e" font-family="sans-serif" font-size="10">• Tailscale Gateway Loopback</text>
  <text x="590" y="285" fill="#8b949e" font-family="sans-serif" font-size="10">• Read-Only Allowlist Filter</text>
  <text x="590" y="300" fill="#ff7b72" font-family="sans-serif" font-size="10">• Blocks /metrics, writes (403)</text>

  <rect x="580" y="340" width="190" height="95" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="590" y="365" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold">Node Exporter 1.9.0</text>
  <text x="590" y="380" fill="#8b949e" font-family="sans-serif" font-size="10">Host Network Mode</text>
  <text x="590" y="395" fill="#8b949e" font-family="sans-serif" font-size="10">CPU, Mem, Disk, enp11s0</text>
  <text x="590" y="410" fill="#ff7b72" font-family="sans-serif" font-size="10">Isolated from Public Funnel</text>

  <!-- External Access Layer -->
  <rect x="850" y="90" width="220" height="370" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="870" y="120" fill="#58a6ff" font-family="sans-serif" font-size="14" font-weight="bold">3. Access Clients</text>

  <rect x="865" y="150" width="190" height="110" rx="6" fill="#21262d" stroke="#238636"/>
  <text x="875" y="175" fill="#7ee787" font-family="sans-serif" font-size="12" font-weight="bold">LAN Laboratory Access</text>
  <text x="875" y="195" fill="#c9d1d9" font-family="sans-serif" font-size="11">http://192.168.1.167:80</text>
  <text x="875" y="215" fill="#8b949e" font-family="sans-serif" font-size="10">• Full 3D Twin &amp; History</text>
  <text x="875" y="230" fill="#8b949e" font-family="sans-serif" font-size="10">• Spatial Registration Allowed</text>
  <text x="875" y="245" fill="#8b949e" font-family="sans-serif" font-size="10">• High speed direct LAN</text>

  <rect x="865" y="280" width="190" height="140" rx="6" fill="#21262d" stroke="#f0883e"/>
  <text x="875" y="305" fill="#f0883e" font-family="sans-serif" font-size="12" font-weight="bold">Tailscale Funnel Public</text>
  <text x="875" y="325" fill="#c9d1d9" font-family="sans-serif" font-size="11">https://*.tailnet.ts.net</text>
  <text x="875" y="345" fill="#8b949e" font-family="sans-serif" font-size="10">• Global Public HTTPS 443</text>
  <text x="875" y="360" fill="#8b949e" font-family="sans-serif" font-size="10">• Cellular / Guest Friendly</text>
  <text x="875" y="375" fill="#7ee787" font-family="sans-serif" font-size="10">• Read-only Dashboard</text>
  <text x="875" y="390" fill="#ff7b72" font-family="sans-serif" font-size="10">• Denies Mutation &amp; Metrics</text>
</svg>
