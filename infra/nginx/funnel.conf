server {
    listen 8080;
    server_name _;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/spatial-registration { return 403; }
    location = /metrics { return 404; }
    location = /ready { return 404; }
    location = /health { return 404; }
    location = /nginx-health { return 404; }

    location = /api/current-state/events {
        limit_except GET { deny all; }
        proxy_pass http://dt_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 86400s;
    }

    location ~ ^/api/assets/[^/]+/(current-state|history)$ {
        limit_except GET { deny all; }
        proxy_pass http://dt_backend;
        proxy_read_timeout 30s;
    }

    location /api/ { return 404; }

    location = / {
        limit_except GET { deny all; }
        proxy_pass http://dt_backend;
    }
    location ~ ^/(assets/[^/]+\.(js|css)|models/rack\.glb)$ {
        limit_except GET { deny all; }
        proxy_pass http://dt_backend;
    }
    location / { return 404; }
}
