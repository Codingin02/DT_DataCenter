# Tailscale Funnel Nginx Gateway Configuration
# Listening only on 127.0.0.1:8080 (loopback)
# Restricts public traffic to read-only dashboard assets and telemetry.

server {
    listen 127.0.0.1:8080;
    server_name _;
    client_max_body_size 16k;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Explicit Denials for internal / sensitive / write endpoints
    location = /api/spatial-registration { return 403; }
    location = /metrics { return 404; }
    location = /ready { return 404; }
    location = /health { return 404; }
    location = /nginx-health { return 404; }

    # Allowed: Real-time Server-Sent Events (SSE) stream (read-only GET)
    location = /api/current-state/events {
        limit_except GET { deny all; }
        proxy_pass http://dt_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 86400s;
    }

    # Allowed: Specific asset telemetry read-only endpoints (GET only)
    location ~ ^/api/assets/[^/]+/(current-state|history)$ {
        limit_except GET { deny all; }
        proxy_pass http://dt_backend;
        proxy_read_timeout 30s;
    }

    # Block any other API endpoints by default
    location /api/ { return 404; }

    # Allowed: Root dashboard HTML
    location = / {
        limit_except GET { deny all; }
        proxy_pass http://dt_backend;
    }

    # Allowed: Static JavaScript, CSS, and 3D GLB model assets
    location ~ ^/(assets/[^/]+\.(js|css)|models/rack\.glb)$ {
        limit_except GET { deny all; }
        proxy_pass http://dt_backend;
    }

    # Default deny for all other requests
    location / { return 404; }
}
