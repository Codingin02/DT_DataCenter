name: dt_datacenter

services:
  postgres:
    image: postgres:17.11-alpine3.24
    container_name: dt-datacenter-postgres
    pull_policy: never
    restart: ${DT_RESTART_POLICY:-no}
    environment:
      POSTGRES_DB: DT_DataCenter
      POSTGRES_USER: bagus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: dt-datacenter-mosquitto
    pull_policy: never
    restart: ${DT_RESTART_POLICY:-no}
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-dt-datacenter}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        mosquitto_passwd -b -c /run/mosquitto/passwords "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /run/mosquitto/passwords
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    tmpfs:
      - /run/mosquitto
    ports:
      - ${DT_MQTT_BIND_ADDRESS:-0.0.0.0}:${DT_MQTT_PORT:-1883}:1883
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mosquitto_pub -h 127.0.0.1 -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" -t dt/healthcheck -m "" -q 1',
        ]
      interval: 3s
      timeout: 8s
      retries: 10

  backend:
    image: dt-datacenter-backend:local
    container_name: dt-datacenter-backend
    pull_policy: never
    restart: ${DT_RESTART_POLICY:-no}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      FRONTEND_DIST: /app/frontend/dist
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-dt-r1-local-backend}
      MQTT_MAX_PAYLOAD_BYTES: ${MQTT_MAX_PAYLOAD_BYTES:-65536}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
      MQTT_SESSION_EXPIRY_SECONDS: ${MQTT_SESSION_EXPIRY_SECONDS:-86400}
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-dt-datacenter}
      PGDATABASE: DT_DataCenter
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGPORT: 5432
      PGUSER: bagus
      SHELLY_MQTT_ID: ${SHELLY_MQTT_ID:-shellyplugpmg3-48f6eebbf3f4}
      HOST_EXPORTER_URL: ${HOST_EXPORTER_URL:-}
      HOST_EXPORTER_PLATFORM: ${HOST_EXPORTER_PLATFORM:-linux}
      HOST_DEVICE_ID: ${HOST_DEVICE_ID:-host-dt-datacenter}
      HOST_NETWORK_NIC: ${HOST_NETWORK_NIC:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - ${DT_HTTP_BIND_ADDRESS:-127.0.0.1}:${DT_HTTP_PORT:-3010}:3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s

  nginx:
    image: nginx:1.28-alpine
    container_name: dt-datacenter-nginx
    pull_policy: never
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - ${DT_NGINX_BIND_ADDRESS:-0.0.0.0}:${DT_NGINX_PORT:-80}:80
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/nginx-health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: ${DT_RESTART_POLICY:-no}

  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: dt-datacenter-node-exporter
    pull_policy: never
    restart: ${DT_RESTART_POLICY:-no}
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($$|/)'

volumes:
  postgres-data:
